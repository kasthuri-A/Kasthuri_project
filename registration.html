<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration</title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <h2>Blood Donation</h2>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="registration.html">Register</a>
            <a href="request.html">Request Blood</a>
            <a href="donorlist.html">Donor List</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <!-- Registration Section -->
    <section class="registration-section">

        <h1>Blood Donor Registration</h1>

        <p class="description">
            Register yourself as a blood donor and help save lives.
        </p>

        <form class="registration-form">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Enter your age">
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="gender"> Male
                    </label>

                    <label>
                        <input type="radio" name="gender"> Female
                    </label>

                    <label>
                        <input type="radio" name="gender"> Others
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
            </div>

            <div class="form-group">
                <label for="blood">Blood Group</label>

                <select id="blood">
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="weight">Weight</label>
                <input type="number" id="weight" placeholder="Enter weight in kg">
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter mobile number">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" placeholder="Enter your address"></textarea>
            </div>

            <div class="form-group">
                <label>Are You Healthy?</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="health"> Yes
                    </label>

                    <label>
                        <input type="radio" name="health"> No
                    </label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit">Register as Donor</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>

        </form>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 Blood Donation Management System</p>
    </footer>

</body>
</html>
